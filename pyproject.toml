[tool.ruff]
required-version = "==0.15.15"
target-version = "py310"
extend-exclude = ["crates/serc/tests/fixtures", "vendor"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "B",
  "B9",
  "C4",
  "SIM",
  "I",
  "UP",
  "PIE",
  "PGH",
  "PYI",
  "RUF",
  "S602",
]
ignore = ["B011", "E501"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true
