[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.94.0"
homepage = "https://github.com/astral-sh/serc"
repository = "https://github.com/astral-sh/serc"
authors = ["Charlie Marsh"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6.1", features = ["derive"] }
codspeed-criterion-compat = { version = "=4.4.1", default-features = false }
criterion = { version = "=0.8.0", default-features = false }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", rev = "e4a063a136ae0e3d6801bd0dad47d09a0f419530" }
ruff_python_codegen = { git = "https://github.com/astral-sh/ruff", rev = "e4a063a136ae0e3d6801bd0dad47d09a0f419530" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", rev = "e4a063a136ae0e3d6801bd0dad47d09a0f419530" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", rev = "e4a063a136ae0e3d6801bd0dad47d09a0f419530" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", rev = "e4a063a136ae0e3d6801bd0dad47d09a0f419530" }
rustc-hash = "2.0.0"

# Utility and development dependencies.
cpu-time = "1.0.0"
fs-err = "3.2.2"
serc_workloads = { path = "crates/serc_workloads" }
rayon = "1.10.0"
tempfile = "3.14.0"
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(codspeed)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
used_underscore_binding = "allow"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
iter_over_hash_type = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
rest_pat_in_fully_bound_structs = "warn"
unused_peekable = "warn"
if_not_else = "allow"
use_self = "warn"
large_stack_arrays = "allow"

[profile.release]
strip = true
lto = "fat"

[profile.profiling]
inherits = "release"
strip = false
debug = "full"
lto = false
