name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check-fmt:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: "Install Rustfmt"
        run: rustup component add rustfmt
      - run: cargo fmt --all --check

  check-python-style:
    name: "Python style"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.5"
      - name: "Install Ruff"
        run: python -m pip install --disable-pip-version-check ruff==0.15.15
      - name: "Check Python style"
        run: ./scripts/check-python-style

  check-pinned-inputs:
    name: "pinned compiler inputs"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: python/cpython
          ref: 2abcf904b8dac8c999d2b3aac76681abb333798a
          path: target/cpython-3.12
          persist-credentials: false
          sparse-checkout: |
            Include
            Python/assemble.c
            Python/compile.c
            Python/flowgraph.c
            Python/Python-ast.c
            Python/marshal.c
            Lib/importlib/_bootstrap_external.py
            Python/opcode_metadata.h
            Lib/opcode.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: python/cpython
          ref: 4061bc4c35f7c26f25264666d4ba083b93d2f6f9
          path: target/cpython-3.13
          persist-credentials: false
          sparse-checkout: |
            Include
            Python/assemble.c
            Python/compile.c
            Python/flowgraph.c
            Python/Python-ast.c
            Python/marshal.c
            Lib/importlib/_bootstrap_external.py
            Lib/_opcode_metadata.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: target/cpython
          persist-credentials: false
          sparse-checkout: |
            Include
            Python/codegen.c
            Python/flowgraph.c
            Python/Python-ast.c
            Python/marshal.c
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: python/cpython
          ref: 435c9e5a798c99653e3ab64ce29baed0e4f3dfee
          path: target/cpython-3.15
          persist-credentials: false
          sparse-checkout: |
            Include
            Python/assemble.c
            Python/codegen.c
            Python/flowgraph.c
            Python/Python-ast.c
            Python/marshal.c
            Python/specialize.c
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: hauntsaninja/mypy_primer
          ref: ff3d9531335dad605d43fcc208c9c159bb09fa81
          path: target/mypy_primer
          persist-credentials: false
          sparse-checkout: mypy_primer/projects.py
          sparse-checkout-cone-mode: false
      - name: "Install Rustfmt"
        run: rustup component add rustfmt
      - name: "Check Ruff revision"
        run: ./scripts/check-ruff-pin
      - name: "Test mypy_primer corpus manager"
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: "Check mypy_primer catalog"
        run: python scripts/mypy_primer_corpus.py check-catalog --primer-checkout target/mypy_primer
      - name: "Test target generator"
        run: python -m unittest discover -s crates/serc/scripts -p 'test_*.py'
      - name: "Check generated Python 3.12 target"
        run: python crates/serc/scripts/generate_cpython_target.py --cpython target/cpython-3.12 --target-version 3.12 --check
      - name: "Check generated Python 3.13 target"
        run: python crates/serc/scripts/generate_cpython_target.py --cpython target/cpython-3.13 --target-version 3.13 --check
      - name: "Check generated Python 3.14 target"
        run: python crates/serc/scripts/generate_cpython_target.py --cpython target/cpython --target-version 3.14 --check
      - name: "Check generated Python 3.15 target"
        run: python crates/serc/scripts/generate_cpython_target.py --cpython target/cpython-3.15 --target-version 3.15 --check

  check-lint:
    name: "clippy on linux"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: "Install Rust toolchain"
        run: rustup component add clippy
      - name: "Clippy"
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  msrv:
    name: "cargo check (MSRV 1.94.0)"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: "Install MSRV toolchain"
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: "Check with MSRV"
        run: cargo +1.94.0 check --workspace --all-targets --all-features --locked

  shear:
    name: "cargo shear"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: "Install cargo-shear"
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
        with:
          tool: cargo-shear@1.12.4
      - run: cargo shear --deny-warnings

  test:
    name: "cargo test on linux"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: python312
        with:
          python-version: "3.12.14"
          update-environment: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: python313
        with:
          python-version: "3.13.15"
          update-environment: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: python314
        with:
          python-version: "3.14.5"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: python315
        with:
          python-version: "3.15.0-rc.2"
          update-environment: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: "Install Rust toolchain"
        run: rustup show
      - name: "Cargo test"
        env:
          SERC_TEST_PYTHON_312: ${{ steps.python312.outputs.python-path }}
          SERC_TEST_PYTHON_313: ${{ steps.python313.outputs.python-path }}
          SERC_TEST_PYTHON: ${{ steps.python314.outputs.python-path }}
          SERC_TEST_PYTHON_315: ${{ steps.python315.outputs.python-path }}
        run: cargo test --workspace --all-targets --all-features --locked

  test-other:
    name: "cargo test (${{ matrix.os }})"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # actions/python-versions provides this security release only for Linux.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: python/cpython
          ref: 2abcf904b8dac8c999d2b3aac76681abb333798a
          path: .cpython-3.12-build
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: python313
        with:
          python-version: "3.13.15"
          update-environment: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: python314
        with:
          python-version: "3.14.5"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: python315
        with:
          python-version: "3.15.0-rc.2"
          update-environment: false
      - name: "Build CPython 3.12.14 (macOS)"
        if: runner.os == 'macOS'
        id: python312-macos
        shell: bash
        working-directory: .cpython-3.12-build
        run: |
          ./configure --prefix="$RUNNER_TEMP/cpython-3.12.14" --without-ensurepip
          make -j"$(sysctl -n hw.logicalcpu)"
          make install
          echo "python-path=$RUNNER_TEMP/cpython-3.12.14/bin/python3.12" >> "$GITHUB_OUTPUT"
      - name: "Build CPython 3.12.14 (Windows)"
        if: runner.os == 'Windows'
        id: python312-windows
        shell: cmd
        working-directory: .cpython-3.12-build
        env:
          PYTHON: ${{ steps.python313.outputs.python-path }}
        run: |
          call PCbuild\build.bat -p x64 -c Release -E --no-ctypes "/p:IncludeTests=false"
          if errorlevel 1 exit /b %errorlevel%
          echo python-path=%CD%\PCbuild\amd64\python.exe>> "%GITHUB_OUTPUT%"
      - name: "Verify CPython 3.12.14 oracle"
        id: python312
        shell: bash
        env:
          PYTHON312: ${{ steps.python312-macos.outputs.python-path || steps.python312-windows.outputs.python-path }}
        run: |
          "$PYTHON312" -B -I -S -c "import compileall, importlib.util, json, marshal, py_compile, struct, sys; assert sys.implementation.name == 'cpython'; assert sys.version_info == (3, 12, 14, 'final', 0); assert importlib.util.MAGIC_NUMBER.hex() == 'cb0d0d0a'"
          echo "python-path=$PYTHON312" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: false
      - name: "Install Rust toolchain"
        run: rustup show
      - name: "Test core library and binary"
        env:
          SERC_TEST_PYTHON_312: ${{ steps.python312.outputs.python-path }}
          SERC_TEST_PYTHON_313: ${{ steps.python313.outputs.python-path }}
          SERC_TEST_PYTHON: ${{ steps.python314.outputs.python-path }}
          SERC_TEST_PYTHON_315: ${{ steps.python315.outputs.python-path }}
        run: cargo test --workspace --lib --bins --all-features --locked
      # The benchmark_scripts integration target remains Linux-only because it exercises
      # Bash-specific tooling.
      - name: "Test CPython compatibility"
        env:
          SERC_TEST_PYTHON_312: ${{ steps.python312.outputs.python-path }}
          SERC_TEST_PYTHON_313: ${{ steps.python313.outputs.python-path }}
          SERC_TEST_PYTHON: ${{ steps.python314.outputs.python-path }}
          SERC_TEST_PYTHON_315: ${{ steps.python315.outputs.python-path }}
        run: cargo test -p serc --test compatibility --all-features --locked
      - name: "Test pinned inputs"
        env:
          SERC_TEST_PYTHON_312: ${{ steps.python312.outputs.python-path }}
          SERC_TEST_PYTHON_313: ${{ steps.python313.outputs.python-path }}
          SERC_TEST_PYTHON: ${{ steps.python314.outputs.python-path }}
          SERC_TEST_PYTHON_315: ${{ steps.python315.outputs.python-path }}
        run: cargo test -p serc --test pinned_inputs --all-features --locked
      - name: "Test CLI"
        env:
          SERC_TEST_PYTHON_312: ${{ steps.python312.outputs.python-path }}
          SERC_TEST_PYTHON_313: ${{ steps.python313.outputs.python-path }}
          SERC_TEST_PYTHON: ${{ steps.python314.outputs.python-path }}
          SERC_TEST_PYTHON_315: ${{ steps.python315.outputs.python-path }}
        run: cargo test -p serc-cli --test cli --all-features --locked

  compatibility:
    name: "CPython compatibility"
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: python314
        with:
          python-version: "3.14.5"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: python315
        with:
          python-version: "3.15.0-rc.2"
          update-environment: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: "Install Rust toolchain"
        run: rustup show
      - name: "Compare with CPython 3.14"
        env:
          CPYTHON: ${{ steps.python314.outputs.python-path }}
        run: ./scripts/check-cpython-compatibility "$CPYTHON"
      - name: "Compare with CPython 3.15"
        env:
          CPYTHON: ${{ steps.python315.outputs.python-path }}
        run: ./scripts/check-cpython-compatibility "$CPYTHON" 3.15

  benchmark:
    name: "CodSpeed benchmarks"
    # Fork pull requests are intentionally skipped so untrusted code cannot request an OIDC token.
    if: >-
      github.repository == 'astral-sh/serc' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: benchmark-${{ runner.os }}-${{ runner.arch }}-profiling-codspeed-simulation
      - name: "Install Rust toolchain"
        run: rustup show
      - name: "Install cargo-codspeed"
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
        with:
          tool: cargo-codspeed@4.4.1
      - name: "Build benchmarks"
        run: cargo codspeed build --locked -m simulation --profile profiling -p serc_benchmark --bench compiler --no-default-features --features "benchmarks,codspeed"
      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@c145068895e045cc725ee76fcd2307624b65c3af # v4.17.5
        with:
          mode: simulation
          run: cargo codspeed run -m simulation -p serc_benchmark --bench compiler

  check-zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        with:
          advanced-security: false
          annotations: true
