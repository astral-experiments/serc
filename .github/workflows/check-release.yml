name: Check release

on:
  pull_request:
    paths:
      - ".github/workflows/*release*.yml"
      - ".github/workflows/*publish*.yml"
      - ".github/workflows/build-binaries.yml"
      - ".github/actions/train-pgo/**"
      - "dist-workspace.toml"
      - "crates/**/dist.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "pyproject.toml"
      - "python/**"
      - "scripts/*release*"
      - "scripts/build-cpython-reference.py"
      - "scripts/cpython-reference.c"
      - "scripts/pgo_corpus.py"
      - "scripts/check-ruff-pin"
      - "scripts/ruff-corpus-expectations"
      - "vendor/ruff"
      - "scripts/publish-crates.py"
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    uses: ./.github/workflows/build-binaries.yml
    permissions:
      contents: read
  crates:
    uses: ./.github/workflows/check-publish.yml
    permissions:
      contents: read
