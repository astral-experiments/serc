name: Build release binaries

on:
  workflow_call:
    outputs:
      distributions:
        description: Artifact ID containing all verified release distributions
        value: ${{ jobs.collect.outputs.distributions }}
      archives:
        description: Artifact ID containing verified standalone archives
        value: ${{ jobs.collect.outputs.archives }}

permissions:
  contents: read

env:
  ACTIONS_CACHE_MODE: none
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          sccache: false
          command: sdist
          args: --out dist
      - name: Install from the source distribution
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/serc-sdist"
          "$RUNNER_TEMP/serc-sdist/bin/python" -m pip install dist/serc-*.tar.gz
          "$RUNNER_TEMP/serc-sdist/bin/serc" --version
          "$RUNNER_TEMP/serc-sdist/bin/python" -m serc --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serc-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  native-wheels:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
      CARGO_TARGET_I686_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              target: x86_64-apple-darwin,
              runner: macos-15-intel,
              python-arch: x64,
            }
          - {
              target: aarch64-apple-darwin,
              runner: macos-15,
              python-arch: arm64,
            }
          - {
              target: x86_64-pc-windows-msvc,
              runner: windows-2025,
              python-arch: x64,
            }
          - {
              target: i686-pc-windows-msvc,
              runner: windows-2025,
              python-arch: x86,
            }
          - {
              target: aarch64-pc-windows-msvc,
              runner: windows-11-arm,
              python-arch: arm64,
            }
    steps:
      - name: Enable long paths for Ruff's Git checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python-arch }}
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          sccache: false
          target: ${{ matrix.target }}
          args: --release --locked --out dist --compatibility pypi
      - name: Test installed wheel
        run: python scripts/test-release-wheel.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serc-wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - name: Archive binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          TARGET=${{ matrix.target }}
          ARCHIVE_NAME=serc-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          mkdir -p "$ARCHIVE_NAME"
          cp "target/$TARGET/release/serc" "$ARCHIVE_NAME/serc"
          tar czvf "$ARCHIVE_FILE" "$ARCHIVE_NAME"
          shasum -a 256 "$ARCHIVE_FILE" > "$ARCHIVE_FILE.sha256"
      - name: Archive binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          TARGET=${{ matrix.target }}
          ARCHIVE_FILE=serc-$TARGET.zip

          7z a "$ARCHIVE_FILE" "./target/$TARGET/release/serc.exe"
          sha256sum "$ARCHIVE_FILE" > "$ARCHIVE_FILE.sha256"
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serc-archives-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.sha256
          if-no-files-found: error

  linux-wheels:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # RISC-V musl defaults to dynamic linking; standalone archives need a static executable.
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_RUSTFLAGS: "-C target-feature=+crt-static"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, manylinux: "2_17", test: true }
          - { target: i686-unknown-linux-gnu, manylinux: "2_17" }
          - { target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { target: armv7-unknown-linux-gnueabihf, manylinux: "2_17" }
          - { target: powerpc64le-unknown-linux-gnu, manylinux: "2_17" }
          - { target: s390x-unknown-linux-gnu, manylinux: "2_17" }
          - { target: riscv64gc-unknown-linux-gnu, manylinux: "2_31" }
          - { target: x86_64-unknown-linux-musl, manylinux: musllinux_1_1 }
          - { target: i686-unknown-linux-musl, manylinux: musllinux_1_1 }
          - { target: aarch64-unknown-linux-musl, manylinux: musllinux_1_1 }
          - { target: armv7-unknown-linux-musleabihf, manylinux: musllinux_1_1 }
          - { target: arm-unknown-linux-musleabihf, manylinux: auto }
          - { target: riscv64gc-unknown-linux-musl, manylinux: musllinux_1_1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build portable wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          sccache: false
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --compatibility pypi
          before-script-linux: |
            # These images bundle GCC versions too old for mimalloc. Keep their
            # glibc sysroots and linkers, but use a current cross C compiler.
            case "${{ matrix.target }}" in
              armv7-unknown-linux-gnueabihf) compiler=arm-linux-gnueabihf-gcc; package=gcc-arm-linux-gnueabihf ;;
              powerpc64le-unknown-linux-gnu) compiler=powerpc64le-linux-gnu-gcc; package=gcc-powerpc64le-linux-gnu ;;
              s390x-unknown-linux-gnu) compiler=s390x-linux-gnu-gcc; package=gcc-s390x-linux-gnu ;;
              *) compiler= ;;
            esac
            if [[ -n "$compiler" ]]; then
              target="${{ matrix.target }}"
              cc_variable="CC_${target//-/_}"
              sysroot="$("${!cc_variable}" -print-sysroot)"
              test -d "$sysroot/usr/include"
              apt-get update
              apt-get install -y "$package"
              export "$cc_variable=$compiler --sysroot=$sysroot"
            fi
            if [[ "${{ matrix.target }}" == "s390x-unknown-linux-gnu" ]]; then
              # psm uses long-displacement instructions; match Rust's z10 baseline.
              export CFLAGS_s390x_unknown_linux_gnu="-march=z10"
            fi
      - name: Test installed wheel
        if: matrix.test
        run: python scripts/test-release-wheel.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serc-wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - name: Archive binary
        shell: bash
        run: |
          set -euo pipefail

          TARGET=${{ matrix.target }}
          ARCHIVE_NAME=serc-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          mkdir -p "$ARCHIVE_NAME"
          cp "target/$TARGET/release/serc" "$ARCHIVE_NAME/serc"
          tar czvf "$ARCHIVE_FILE" "$ARCHIVE_NAME"
          shasum -a 256 "$ARCHIVE_FILE" > "$ARCHIVE_FILE.sha256"
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serc-archives-${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256
          if-no-files-found: error

  collect:
    needs: [sdist, native-wheels, linux-wheels]
    runs-on: ubuntu-24.04
    outputs:
      distributions: ${{ steps.upload.outputs.artifact-id }}
      archives: ${{ steps.upload-archives.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: serc-wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: serc-sdist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: serc-archives-*
          path: standalone
          merge-multiple: true
      - name: Check standalone archives
        working-directory: standalone
        run: sha256sum -c *.sha256
      - name: Check distribution contents
        run: python3 scripts/check-release-distributions.py dist --expected-wheels 18
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-archives
        with:
          name: serc-standalone-archives
          path: standalone/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: serc-distributions
          path: dist/*
          if-no-files-found: error
